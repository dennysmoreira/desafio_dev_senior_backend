services:

  postgres:
    image: postgres:17-alpine
    container_name: fiscal-postgres
    environment:
      POSTGRES_DB: fiscal
      POSTGRES_USER: fiscal
      POSTGRES_PASSWORD: fiscal
    ports:
      - "5433:5432"
    volumes:
      - fiscal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiscal -d fiscal"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: fiscal-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: fiscal
      RABBITMQ_DEFAULT_PASS: fiscal
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Fica atrás de um profile: sem isso a API ocuparia a 5099 e entraria em conflito
  # com quem roda `dotnet run` local, que é o caminho padrão do README.
  #
  #   docker compose up -d                       -> só a infraestrutura
  #   docker compose --profile completo up -d    -> tudo, sem precisar do SDK
  api:
    profiles: ["completo"]
    build:
      context: .
      dockerfile: src/Fiscal.Api/Dockerfile
    container_name: fiscal-api
    environment:
      # Dentro da rede do compose, os serviços se enxergam pelo nome e pela porta
      # interna — 5432 e 5672, não as portas publicadas no host.
      ConnectionStrings__Fiscal: "Host=postgres;Port=5432;Database=fiscal;Username=fiscal;Password=fiscal"
      ConnectionStrings__RabbitMq: "amqp://fiscal:fiscal@rabbitmq:5672/"
      Autenticacao__ChaveDeApi: "chave-de-desenvolvimento"
      ASPNETCORE_ENVIRONMENT: "Development"
    ports:
      - "5099:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Segundo deployável, atrás do mesmo profile. Não publica porta: não serve HTTP.
  #
  # Separado da API porque, enquanto o consumidor era hospedado dentro do processo
  # web, escalar a API multiplicava consumidores sem que ninguém escolhesse isso e um
  # deploy rolling interrompia mensagem em processamento.
  worker:
    profiles: ["completo"]
    build:
      context: .
      dockerfile: src/Fiscal.Worker/Dockerfile
    # Sem container_name de propósito: nome fixo impede `--scale`, e escalar o
    # consumidor sem tocar na API é justamente a razão de ele existir separado.
    # Os consumidores concorrem na mesma fila; o inbox garante que a mesma mensagem
    # produza efeito uma vez só, independente de quem a pegar.
    environment:
      ConnectionStrings__Fiscal: "Host=postgres;Port=5432;Database=fiscal;Username=fiscal;Password=fiscal"
      ConnectionStrings__RabbitMq: "amqp://fiscal:fiscal@rabbitmq:5672/"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  fiscal-pgdata:
