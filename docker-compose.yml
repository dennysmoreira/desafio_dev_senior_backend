services:

  postgres:
    image: postgres:17-alpine
    container_name: fiscal-postgres
    environment:
      POSTGRES_DB: fiscal
      POSTGRES_USER: fiscal
      POSTGRES_PASSWORD: fiscal
    ports:
      - "5433:5432"
    volumes:
      - fiscal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiscal -d fiscal"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: fiscal-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: fiscal
      RABBITMQ_DEFAULT_PASS: fiscal
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  fiscal-pgdata:
